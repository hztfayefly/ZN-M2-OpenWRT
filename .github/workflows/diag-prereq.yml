name: diag-prereq

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison gawk gettext automake autopoint libtool libtool-bin autoconf pkgconf pkg-config zlib1g-dev libncurses-dev ncurses-term libreadline-dev libssl-dev libelf-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev gnutls-dev python3 python3-dev python3-distutils python3-setuptools python3-pip python3-pyelftools python3-ply python3-docutils python-is-python3 rsync unzip zip gzip bzip2 xz-utils zstd tar cpio ccache cmake ninja-build meson scons swig qemu-utils patch diffstat wget curl git gpg gperf help2man intltool bc findutils file lrzsz genisoimage device-tree-compiler squashfs-tools cryptsetup-bin diffutils texinfo xxd dosfstools

      - name: Clone
        run: |
          git clone --depth 1 -b 25.12-nss https://github.com/LiBwrt/LibWrt.git openwrt
          cp config/ZN_M2-6.12-nowifi.config openwrt/.config

      - name: Show host bin before prereq
        run: |
          cd openwrt
          echo "--- staging_dir/host/bin ---"
          ls -la staging_dir/host/bin 2>&1 | head -30
          echo "--- which gcc ---"
          command -v gcc
          echo "--- umask ---"
          umask

      - name: Run prereq with stderr VISIBLE
        run: |
          cd openwrt
          echo "===== 直接运行 prereq-build.mk，stderr 不丢弃 ====="
          set +e
          make -j1 -r -f "$(pwd)/include/prereq-build.mk" prereq V=s 2>&1 | tail -150
          echo "===== EXIT=${PIPESTATUS[0]} ====="

      - name: Manual mkhash compile test
        run: |
          cd openwrt
          echo "--- 手动编译 mkhash ---"
          mkdir -p staging_dir/host/bin
          gcc -O2 -I$(pwd)/tools/include -o /tmp/mkhash_test scripts/mkhash.c 2>&1 | tail -20
          echo "EXIT=$?"
          ls -la /tmp/mkhash_test 2>&1
