name: diag-prereq

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set +e
          sudo -E apt-get -y update
          MISS=""
          for pkg in build-essential clang flex bison gawk gettext automake autopoint libtool libtool-bin autoconf pkg-config zlib1g-dev libncurses-dev ncurses-term libreadline-dev libssl-dev libelf-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev gnutls-dev python3 python3-dev python3-distutils python3-setuptools python3-pip python3-pyelftools python3-ply python3-docutils python-is-python3 rsync unzip zip gzip bzip2 xz-utils zstd tar cpio ccache cmake ninja-build meson scons swig qemu-utils patch diffstat wget curl git gpg gperf help2man intltool bc findutils file lrzsz genisoimage device-tree-compiler squashfs-tools cryptsetup-bin diffutils texinfo xxd dosfstools; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              sudo -E apt-get -y install --no-install-recommends "$pkg" >/dev/null 2>&1 || MISS="$MISS $pkg"
            fi
          done
          echo ">>> 依赖安装完成。跳过的包:${MISS:- 无}"
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
          fi
          echo "python=$(command -v python)"
          exit 0

      - name: Clone
        run: |
          set +e
          git clone --depth 1 -b 25.12-nss https://github.com/LiBwrt/LibWrt.git openwrt
          cp config/ZN_M2-6.12-nowifi.config openwrt/.config
          exit 0

      - name: Faithful repro of defconfig prereq
        run: |
          set +e
          cd openwrt
          export TOPDIR=$(pwd)
          echo "===== 忠实复现：make -j1 -r -s -f include/prereq-build.mk prereq（stderr 可见）====="
          make -j1 -r -s -f "$TOPDIR/include/prereq-build.mk" prereq V=s > /tmp/preq1.log 2>&1
          echo "EXIT1=$?"
          tail -60 /tmp/preq1.log
          echo "===== tmp/.prereq-error ====="
          cat tmp/.prereq-error 2>&1
          echo "===== staging_dir/host/bin ====="
          ls -la staging_dir/host/bin 2>&1 | head -40
          exit 0

      - name: Test workaround pre-create host gcc symlink
        run: |
          set +e
          cd openwrt
          export TOPDIR=$(pwd)
          rm -rf tmp/.prereq-error
          mkdir -p staging_dir/host/bin
          ln -sf "$(command -v gcc)" staging_dir/host/bin/gcc
          ln -sf "$(command -v g++)" staging_dir/host/bin/g++
          echo "===== 预建 gcc 符号链接后再跑 prereq ====="
          make -j1 -r -s -f "$TOPDIR/include/prereq-build.mk" prereq V=s > /tmp/preq2.log 2>&1
          echo "EXIT2=$?"
          tail -60 /tmp/preq2.log
          echo "===== tmp/.prereq-error ====="
          cat tmp/.prereq-error 2>&1
          echo "===== staging_dir/host/bin ====="
          ls -la staging_dir/host/bin 2>&1 | head -40
          echo "===== 再跑 make defconfig ====="
          make defconfig V=s > /tmp/defconfig.log 2>&1
          echo "DEFCONFIG_EXIT=$?"
          tail -30 /tmp/defconfig.log
          ls -la .config
          exit 0
