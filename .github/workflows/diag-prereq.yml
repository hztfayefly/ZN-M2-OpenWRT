name: diag-prereq

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          MISS=""
          for pkg in build-essential clang flex bison gawk gettext automake autopoint libtool libtool-bin autoconf pkg-config zlib1g-dev libncurses-dev ncurses-term libreadline-dev libssl-dev libelf-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev gnutls-dev python3 python3-dev python3-distutils python3-setuptools python3-pip python3-pyelftools python3-ply python3-docutils python-is-python3 rsync unzip zip gzip bzip2 xz-utils zstd tar cpio ccache cmake ninja-build meson scons swig qemu-utils patch diffstat wget curl git gpg gperf help2man intltool bc findutils file lrzsz genisoimage device-tree-compiler squashfs-tools cryptsetup-bin diffutils texinfo xxd dosfstools; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              sudo -E apt-get -y install --no-install-recommends "$pkg" >/dev/null 2>&1 || MISS="$MISS $pkg"
            fi
          done
          echo ">>> 依赖安装完成。跳过的包:${MISS:- 无}"

      - name: Clone
        run: |
          git clone --depth 1 -b 25.12-nss https://github.com/LiBwrt/LibWrt.git openwrt
          cp config/ZN_M2-6.12-nowifi.config openwrt/.config

      - name: Pre-prereq state
        run: |
          cd openwrt
          echo "--- umask ---"; umask
          echo "--- which gcc ---"; command -v gcc
          echo "--- staging_dir/host/bin (before) ---"
          ls -la staging_dir/host/bin 2>&1 | head -30
          echo "--- tmp exists? ---"; ls -ld tmp 2>&1

      - name: Run prereq-build.mk directly with stderr VISIBLE
        run: |
          cd openwrt
          set +e
          make -j1 -r -s -f "$(pwd)/include/prereq-build.mk" prereq V=s 2>&1 | tail -200
          echo "===== PREREQ_EXIT=${PIPESTATUS[0]} ====="
          echo "--- tmp/.prereq-error ---"
          cat tmp/.prereq-error 2>&1
          echo "--- staging_dir/host/bin (after) ---"
          ls -la staging_dir/host/bin 2>&1 | head -30

      - name: Manual mkhash compile test
        run: |
          cd openwrt
          set +e
          mkdir -p staging_dir/host/bin
          echo "--- gcc version ---"; gcc --version | head -2
          gcc -O2 -I"$(pwd)/tools/include" -o /tmp/mkhash_test scripts/mkhash.c 2>&1 | tail -25
          echo "MANUAL_EXIT=$?"
          ls -la /tmp/mkhash_test 2>&1
          echo "--- test run ---"; /tmp/mkhash_test 2>&1 | head -3
