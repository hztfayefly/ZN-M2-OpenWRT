name: ZN_M2-6.12-NOWIFI

on:
  workflow_dispatch:
  # schedule:
  #  - cron: 0 12 * * 5

permissions:
  contents: write

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: config/ZN_M2-6.12-nowifi.config
  DIY_SCRIPT: diy/ZN_M2-diy.sh
  CLASH_KERNEL: amd64
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: ZN_M2-6.12-NOWIFI
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean

        echo ">>> 安装编译依赖（原 is.gd/depends_ubuntu_2204 短链接已 404 失效，改为内联清单）"
        echo ">>> 注意：安装放在 autoremove 之后，避免被清理"
        DEPS="build-essential clang flex bison gawk gettext \
        automake autopoint libtool libtool-bin autoconf pkgconf pkg-config \
        zlib1g-dev libncurses-dev ncurses-term libreadline-dev \
        libssl-dev libelf-dev libglib2.0-dev libgmp-dev libmpc-dev libmpfr-dev gnutls-dev \
        python3 python3-dev python3-distutils python3-setuptools python3-pip \
        python3-pyelftools python3-ply python3-docutils python-is-python3 \
        rsync unzip zip gzip bzip2 xz-utils zstd tar cpio ccache \
        cmake ninja-build meson scons swig qemu-utils \
        patch diffstat wget curl git gpg gperf help2man intltool \
        bc findutils file lrzsz genisoimage device-tree-compiler \
        squashfs-tools cryptsetup-bin diffutils \
        texinfo xxd dosfstools"
        MISS=""
        for pkg in $DEPS; do
          if ! dpkg -s "$pkg" >/dev/null 2>&1; then
            sudo -E apt-get -y install --no-install-recommends "$pkg" >/dev/null 2>&1 || MISS="$MISS $pkg"
          fi
        done
        echo ">>> 依赖安装完成。跳过的包:${MISS:- 无}"

        echo ">>> 兜底：LiBwrt prereq-build 会检查 python 命令（Ubuntu 22.04 默认无）"
        if ! command -v python >/dev/null 2>&1; then
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python || true
        fi

        echo ">>> prereq 所需命令全量校验:"
        for t in awk bash bzip2 cp diff egrep file find g++ gcc getopt git grep gzip install patch perl python python3 realpath rsync seq stat tar unzip wget which xargs; do
          printf "    %-9s %s\n" "$t" "$(command -v $t 2>/dev/null || echo '*** 缺失 ***')"
        done

        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks(合并磁盘)
      # 已禁用：该步骤用 loop 设备在当前 runner 的根分区上创建 109G 卷文件，
      # 把 / 从 41% 撑到 100% 满，导致 make 写入失败（write error: stdout）、prereq 全部失败。
      # 现代 GitHub runner 的 / 已有 87G 可用，足够 OpenWrt 编译，无需合并磁盘。
      if: false
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@main

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.12)
        echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        echo ">>> [diag] workspace=$(pwd)"
        echo ">>> [diag] CONFIG_FILE=$CONFIG_FILE"
        echo ">>> [diag] OPENWRT_PATH=$OPENWRT_PATH"
        ls -la "$CONFIG_FILE" 2>&1 || echo "!! CONFIG_FILE 不存在"
        ls -la "$OPENWRT_PATH" 2>&1 | head -5 || echo "!! OPENWRT_PATH 不存在"
        echo ">>> [diag] copy config"
        cp -v "$CONFIG_FILE" "$OPENWRT_PATH/.config"
        echo ">>> [diag] cp exit=$?"
        cd "$OPENWRT_PATH"
        echo ">>> [diag] make defconfig 输出开始"
        make defconfig 2>&1 | tail -80
        echo ">>> [diag] defconfig exit=${PIPESTATUS[0]}"
        if [ -f .config ]; then echo ">>> [diag] .config 行数=$(wc -l < .config)"; else echo "!! .config 不存在"; fi
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(grep -m1 '^CONFIG_TARGET_BOARD=' .config | awk -F '"' '{print $2}' || true)
        if [ -z "$DEVICE_TARGET" ]; then DEVICE_TARGET=qualcommax; fi
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(grep -m1 '^CONFIG_TARGET_SUBTARGET=' .config | awk -F '"' '{print $2}' || true)
        if [ -z "$DEVICE_SUBTARGET" ]; then DEVICE_SUBTARGET=ipq60xx; fi
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo ">>> [diag] DEVICE_TARGET=$DEVICE_TARGET DEVICE_SUBTARGET=$DEVICE_SUBTARGET"

    - name: Cache Toolchain(缓存工具链)
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}
    
    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
  
    - name: Load Custom Configuration(加载自定义配置)
      run: |
        echo "加载自定义配置文件"
        [ -e files ] && mv files $OPENWRT_PATH/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRT_PATH/.config
        # echo "加载自定义脚本"
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        # echo "运行自定义脚本"
        $GITHUB_WORKSPACE/$DIY_SCRIPT
        # echo "自定义脚本运行完毕"

    - name: Download DL Package(下载DL软件包)
      run: |
        cd $OPENWRT_PATH
        df -h / | tail -1
        make defconfig
        echo "===== [diag] 设备选择校验 ====="
        grep -E "^CONFIG_TARGET_(MULTI_PROFILE|DEVICE_qualcommax_ipq60xx_DEVICE_zn_m2)=" .config || true
        if ! grep -qE "^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_zn_m2=y" .config; then
          echo "::error::zn_m2 未被选中，产物将是错误机型，立即终止"
          exit 1
        fi
        echo "===== [diag] zn_m2 已选中，继续 ====="
        echo "===== 目标插件是否保留在最终 .config 中 ====="
        for p in luci-app-openclash luci-app-zerotier luci-app-ttyd ttyd dnsmasq-full ruby ruby-yaml; do
          printf "  %-22s %s\n" "$p" "$(grep -m1 \"^CONFIG_PACKAGE_${p}=\" .config || echo '未启用')"
        done
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile Firmware(开始编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "===== [diag] 产物镜像 ====="
        ls -la bin/targets/*/*/ 2>/dev/null | grep -iE "zn_m2|sysupgrade|factory" || true
        ls bin/targets/*/*/*zn_m2* 2>/dev/null || echo "::warning::未找到 zn_m2 镜像"
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: 输出构建日志
      if: failure()
      run: |
        if [ -f "$OPENWRT_PATH/build.log" ]; then cat "$OPENWRT_PATH/build.log"; else echo "build.log 未生成（源码可能未成功克隆）"; ls -la "$OPENWRT_PATH" 2>/dev/null || true; fi
    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory(上传固件)
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.FIRMWARE_TAG }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **此 OpenWrt 固件为 ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息(无WIFI)
          - 无WIFI带有线NSS的6.12内核固件
          - 💻 这是 ${{ env.FIRMWARE_TAG }} 平台使用的 OpenWrt 固件
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🌐 默认地址: 192.168.1.1
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件内核版本：${{ env.VERSION_KERNEL }}
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.VERSION_INFO }}
